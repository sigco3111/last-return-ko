# Tells cert-manager how to get certificates: from Let's Encrypt, proving each hostname over
# http through Traefik. Cluster-wide, so any namespace can ask for a certificate with the
# annotation cert-manager.io/cluster-issuer: letsencrypt
#
# No e-mail address is given. It is optional, and Let's Encrypt no longer sends expiry mail.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
