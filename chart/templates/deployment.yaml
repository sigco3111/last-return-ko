apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "last-return.name" . }}
  labels:
    {{- include "last-return.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "last-return.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "last-return.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ required "image.repository is not set. Pass --set image.repository=<registry-host>/last-return" .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.serverName }}
          {{- if not (regexMatch "^[A-Za-z0-9 ._-]{1,40}$" .) }}
          {{- fail "serverName may only hold letters, digits, spaces, dots, underscores and hyphens, 40 at most." }}
          {{- end }}
          env:
            - name: LAST_RETURN_SERVER_NAME
              value: {{ . | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
