{{- if .Values.ingress.enabled }}
{{- $name := include "last-return.name" . }}
{{- $issuer := .Values.ingress.clusterIssuer }}
{{- $tlsSecret := .Values.ingress.tlsSecretName | default (ternary (printf "%s-tls" $name) "" (ne $issuer "")) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "last-return.labels" . | nindent 4 }}
  {{- if or $issuer .Values.ingress.annotations }}
  annotations:
    {{- with $issuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is not set. Pass --set ingress.host=<hostname>" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
  {{- with $tlsSecret }}
  tls:
    - hosts:
        - {{ $.Values.ingress.host | quote }}
      secretName: {{ . }}
  {{- end }}
{{- end }}
